<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NIGHTOWLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08080b;
    --void-2:#0f0f14;
    --ember:#d91e36;
    --ember-glow:#ff3b52;
    --moon:#f2c94c;
    --dusk:#171a26;
    --dusk-2:#1d2133;
    --fog:#9aa0ad;
    --snow:#f5f5f0;
    --line:rgba(255,255,255,0.08);
    --display:'Anton', Impact, sans-serif;
    --body:'Inter', -apple-system, sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--void); color:var(--snow); font-family:var(--body); overflow-x:hidden; -webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--ember); color:white;}

  /* ---------- SCROLLBAR (rows) ---------- */
  .row-track::-webkit-scrollbar{height:6px;}
  .row-track::-webkit-scrollbar-thumb{background:var(--dusk-2); border-radius:3px;}

  /* =====================================================
     INTRO — classic dark-sweep reveal, ending on NIGHTOWLS
     ===================================================== */
  #intro{
    position:fixed; inset:0; background:#000; z-index:9999;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #intro.hide{ animation: introOut .6s ease forwards; pointer-events:none; }
  @keyframes introOut{ to{ opacity:0; } }

  #intro video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    display:none; /* shown only if a real video src is supplied — see SETUP note in JS */
  }

  .stars{ position:absolute; inset:0; opacity:0; animation: starsFade .9s ease forwards; }
  @keyframes starsFade{ to{opacity:.5;} }
  .stars span{
    position:absolute; width:2px; height:2px; background:var(--snow); border-radius:50%;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }

  .sweep{
    position:absolute; top:0; bottom:0; width:14vw;
    background:linear-gradient(90deg, transparent, var(--ember-glow) 45%, var(--ember) 55%, transparent);
    filter:blur(6px);
    left:-20vw;
    animation: sweepAcross 1.1s cubic-bezier(.6,0,.2,1) .35s forwards;
    opacity:0;
  }
  @keyframes sweepAcross{
    0%{ left:-20vw; opacity:0; }
    10%{ opacity:1;}
    90%{ opacity:1;}
    100%{ left:106vw; opacity:0; }
  }

  .wordmark{
    position:relative; font-family:var(--display); letter-spacing:.04em;
    font-size:clamp(2.6rem, 11vw, 7rem);
    color:var(--ember);
    text-shadow:0 0 40px rgba(217,30,54,.55), 0 0 90px rgba(217,30,54,.25);
    opacity:0; transform:scale(.82);
    animation: wordIn .7s cubic-bezier(.2,.9,.25,1) 1.15s forwards;
    display:flex; align-items:baseline; gap:.02em;
  }
  @keyframes wordIn{
    0%{ opacity:0; transform:scale(.82); }
    60%{ opacity:1; transform:scale(1.05); }
    100%{ opacity:1; transform:scale(1); }
  }
  .eye{
    display:inline-block; width:.55em; height:.55em; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6d6, var(--moon) 55%, #8a6a12 100%);
    box-shadow:0 0 18px rgba(242,201,76,.85);
    position:relative; top:.06em; overflow:hidden;
  }
  .eye::before{
    /* pupil */
    content:''; position:absolute; left:50%; top:50%; width:36%; height:36%;
    background:#1a1206; border-radius:50%; transform:translate(-50%,-50%);
  }
  .eye::after{
    /* eyelid — slides down to close, then retracts back up */
    content:''; position:absolute; left:-8%; right:-8%; top:0; height:0%;
    background:var(--lid-color, #000);
    border-radius:0 0 50% 50%;
    animation: blink 4.2s ease-in-out infinite;
  }
  @keyframes blink{
    0%, 84%, 100% { height:0%; }
    88% { height:100%; }
    92% { height:0%; }
  }
  .wordmark .eye{ width:.5em; height:.5em; }
  .wordmark .eye::after{ --lid-color:#000; }
  .logo .eye::after{ --lid-color:var(--void); animation-delay:1.1s; }

  .tagline{
    position:absolute; bottom:14%; left:0; right:0; text-align:center;
    font-family:var(--mono); font-size:.72rem; letter-spacing:.35em; text-transform:uppercase;
    color:var(--fog); opacity:0;
    animation: tagIn .6s ease 1.7s forwards;
  }
  @keyframes tagIn{ to{ opacity:1; } }

  #skipIntro{
    position:absolute; bottom:24px; right:24px; z-index:2;
    background:rgba(255,255,255,.08); border:1px solid var(--line); color:var(--snow);
    padding:8px 16px; border-radius:100px; font-size:.78rem; opacity:0;
    animation: tagIn .5s ease .4s forwards;
  }
  #skipIntro:hover{ background:rgba(255,255,255,.16); }

  /* =====================================================
     APP SHELL
     ===================================================== */
  #app{ opacity:0; }
  #app.show{ opacity:1; transition:opacity .6s ease; }

  header.nav{
    position:fixed; top:0; left:0; right:0; z-index:500;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px clamp(16px,4vw,48px);
    background:linear-gradient(180deg, rgba(8,8,11,.92), transparent);
    backdrop-filter:blur(2px);
  }
  .logo{
    font-family:var(--display); color:var(--ember); font-size:1.35rem; letter-spacing:.03em;
    display:flex; align-items:center; gap:.02em; user-select:none;
  }
  .logo .eye{ width:.5em; height:.5em; box-shadow:0 0 8px rgba(242,201,76,.7); }
  .nav-actions{ display:flex; align-items:center; gap:10px; }
  .btn{
    border:none; border-radius:8px; padding:10px 16px; font-weight:600; font-size:.85rem;
    display:inline-flex; align-items:center; gap:8px; transition:transform .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--ember); color:white; }
  .btn-primary:hover{ background:var(--ember-glow); }
  .btn-ghost{ background:rgba(255,255,255,.08); color:var(--snow); border:1px solid var(--line); }
  .btn-ghost:hover{ background:rgba(255,255,255,.14); }

  main{ padding-top:76px; }

  .hero{
    position:relative; margin:0 clamp(16px,4vw,48px) 8px; border-radius:18px; overflow:hidden;
    min-height:min(56vw, 420px); display:flex; align-items:flex-end;
    background:linear-gradient(140deg, var(--dusk), var(--dusk-2));
    border:1px solid var(--line);
  }
  .hero-bg{ position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(.55) saturate(1.1); }
  .hero-fade{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(8,8,11,.95) 8%, rgba(8,8,11,.15) 55%, transparent 90%); }
  .hero-content{ position:relative; padding:clamp(20px,4vw,44px); max-width:640px; }
  .hero-eyebrow{ font-family:var(--mono); font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; color:var(--moon); margin-bottom:10px; }
  .hero-title{ font-family:var(--display); font-size:clamp(1.8rem,5vw,3.2rem); line-height:1.02; margin-bottom:10px; }
  .hero-meta{ color:var(--fog); font-size:.9rem; margin-bottom:16px; }
  .hero-empty{ text-align:center; margin:auto; padding:60px 24px; }
  .hero-empty h2{ font-family:var(--display); font-size:clamp(1.6rem,4vw,2.4rem); margin-bottom:10px; }
  .hero-empty p{ color:var(--fog); margin-bottom:20px; }

  .section-title{ font-size:1.15rem; font-weight:700; margin:34px clamp(16px,4vw,48px) 14px; display:flex; align-items:baseline; gap:10px; }
  .section-title small{ font-family:var(--mono); font-weight:400; color:var(--fog); font-size:.72rem; letter-spacing:.1em; }

  .row-track{
    display:flex; gap:14px; overflow-x:auto; padding:4px clamp(16px,4vw,48px) 16px;
    scroll-snap-type:x proximity;
  }
  .card{
    scroll-snap-align:start; flex:0 0 auto; width:min(46vw, 220px); aspect-ratio:2/3;
    border-radius:10px; overflow:hidden; position:relative; cursor:pointer;
    background:var(--dusk); border:1px solid var(--line);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card:hover{ transform:translateY(-6px) scale(1.03); box-shadow:0 18px 34px rgba(0,0,0,.5); z-index:2;}
  .card img{ width:100%; height:100%; object-fit:cover; }
  .card-info{
    position:absolute; left:0; right:0; bottom:0; padding:10px;
    background:linear-gradient(0deg, rgba(0,0,0,.92), transparent);
  }
  .card-info .t{ font-weight:700; font-size:.85rem; line-height:1.2; margin-bottom:2px; }
  .card-info .d{ font-family:var(--mono); font-size:.68rem; color:var(--fog); }

  .addcard{
    scroll-snap-align:start; flex:0 0 auto; width:min(46vw, 220px); aspect-ratio:2/3;
    border-radius:10px; border:1px dashed var(--line); background:rgba(255,255,255,.02);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    color:var(--fog); transition:border-color .2s ease, color .2s ease;
  }
  .addcard:hover{ border-color:var(--ember); color:var(--snow); }
  .addcard .plus{ font-size:2.2rem; line-height:1; color:var(--ember); }

  footer{ text-align:center; padding:60px 24px 40px; color:var(--fog); font-size:.78rem; font-family:var(--mono); letter-spacing:.05em; }

  /* =====================================================
     MODALS
     ===================================================== */
  .overlay{
    position:fixed; inset:0; background:rgba(4,4,6,.82); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--dusk); border:1px solid var(--line); border-radius:16px; width:100%; max-width:480px;
    max-height:88vh; overflow-y:auto; transform:translateY(16px) scale(.98); transition:transform .25s ease;
  }
  .overlay.open .modal{ transform:translateY(0) scale(1); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); }
  .modal-head h3{ font-family:var(--display); font-size:1.15rem; letter-spacing:.02em; }
  .modal-close{ background:none; border:none; color:var(--fog); font-size:1.4rem; line-height:1; padding:4px 8px; }
  .modal-close:hover{ color:var(--snow); }
  .modal-body{ padding:20px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.78rem; color:var(--fog); margin-bottom:6px; font-weight:600; letter-spacing:.02em; }
  .field input[type=text], .field input[type=date]{
    width:100%; background:var(--void-2); border:1px solid var(--line); color:var(--snow);
    border-radius:8px; padding:11px 12px; font-size:.92rem; font-family:var(--body);
  }
  .field input:focus{ outline:2px solid var(--ember); outline-offset:1px; }

  .drop{
    border:1.5px dashed var(--line); border-radius:10px; padding:22px; text-align:center; color:var(--fog);
    cursor:pointer; position:relative; overflow:hidden; min-height:140px;
    display:flex; align-items:center; justify-content:center; background:var(--void-2);
  }
  .drop.has-img{ padding:0; }
  .drop img{ width:100%; height:220px; object-fit:cover; }
  .drop:hover{ border-color:var(--ember); }
  .drop input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions .btn{ flex:1; justify-content:center; }

  .detail-img{ width:100%; max-height:52vh; object-fit:cover; }
  .detail-body{ padding:20px; }
  .detail-title{ font-family:var(--display); font-size:1.5rem; margin-bottom:6px; }
  .detail-meta{ color:var(--fog); font-size:.85rem; font-family:var(--mono); margin-bottom:14px; }
  .chip{ display:inline-block; background:var(--dusk-2); border:1px solid var(--line); padding:5px 11px; border-radius:100px; font-size:.78rem; margin:0 6px 6px 0; }
  .danger{ background:transparent; border:1px solid var(--ember); color:var(--ember); }
  .danger:hover{ background:rgba(217,30,54,.12); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); z-index:2000;
    background:var(--dusk-2); border:1px solid var(--line); padding:12px 20px; border-radius:100px;
    font-size:.85rem; opacity:0; transition:all .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .spinner{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.25); border-top-color:var(--ember); animation:spin .7s linear infinite; display:inline-block;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width: 640px){
    .nav-actions .btn span.label{ display:none; }
    .hero{ min-height:64vw; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<!-- =====================================================
     INTRO SEQUENCE
     ===================================================== -->
<div id="intro">
  <!--
    SETUP NOTE (for you, the site owner):
    If you'd like to use your own opening video instead of the built-in
    animated reveal, set its source below. Paste either a hosted video URL
    or a base64 data: URI into VIDEO_SRC in the <script> at the bottom of
    this file. When VIDEO_SRC is set, it plays instead of the CSS animation,
    with "NIGHTOWLS" overlaid at the reveal moment.
  -->
  <video id="introVideo" muted playsinline></video>
  <div class="stars" id="stars"></div>
  <div class="sweep"></div>
  <div class="wordmark">NIGHT<span class="eye"></span>WLS</div>
  <div class="tagline">memories, after dark</div>
  <button id="skipIntro">Skip intro</button>
</div>

<!-- =====================================================
     APP
     ===================================================== -->
<div id="app">
  <header class="nav">
    <div class="logo">NIGHT<span class="eye"></span>WLS</div>
    <div class="nav-actions">
      <button class="btn btn-ghost" id="openAllBtn"><span class="label">All memories</span></button>
      <button class="btn btn-primary" id="openAddBtn">+ <span class="label">Add memory</span></button>
    </div>
  </header>

  <main>
    <div id="heroSlot"></div>
    <div id="rowsSlot"></div>
    <footer>NIGHTOWLS &middot; a gallery for the nights worth keeping</footer>
  </main>
</div>

<!-- Add Memory Modal -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>New memory</h3>
      <button class="modal-close" data-close="addOverlay">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Photo</label>
        <label class="drop" id="dropZone">
          <span id="dropText">Tap to choose a photo, or drag one here</span>
          <img id="dropPreview" style="display:none">
          <input type="file" accept="image/*" id="fileInput">
        </label>
      </div>
      <div class="field">
        <label>Title it yourself</label>
        <input type="text" id="titleInput" placeholder="e.g. Rooftop, 2am" maxlength="60">
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label>Friends there (comma separated)</label>
        <input type="text" id="friendsInput" placeholder="e.g. Sam, Priya, Theo">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="addOverlay">Cancel</button>
        <button class="btn btn-primary" id="saveMemoryBtn">Save memory</button>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal"></div>
</div>

<!-- All Memories Modal -->
<div class="overlay" id="allOverlay">
  <div class="modal" style="max-width:720px;">
    <div class="modal-head">
      <h3>All memories</h3>
      <button class="modal-close" data-close="allOverlay">&times;</button>
    </div>
    <div class="modal-body" id="allGrid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     OPTIONAL: paste your own intro video source here.
     e.g. "https://yourhost.com/opening.mp4"  or  "data:video/mp4;base64,...."
     Leave empty to use the built-in animated reveal.
  --------------------------------------------------------- */
  const VIDEO_SRC = "";

  /* ---------------------------------------------------------
     STORAGE BACKEND
     ---------------------------------------------------------
     'claude'   → uses window.storage. Works instantly, but ONLY
                  inside a claude.ai / Claude app artifact — it does
                  NOT exist on a normal website, so this option will
                  not persist data once you host this file yourself.

     'firebase' → uses Google Firebase (Firestore), which is free
                  for this scale and works on ANY website you host
                  this file on — GitHub Pages, Netlify, your own
                  domain, anywhere.

     To switch to Firebase (5 min, no server needed):
       1. Go to console.firebase.google.com → Add project (free).
       2. In the project, open Build → Firestore Database → Create
          database → start in TEST MODE (or set rules below).
       3. Project settings (gear icon) → General → "Your apps" →
          add a Web app → copy the firebaseConfig object it gives you.
       4. Paste it into FIREBASE_CONFIG below, and change BACKEND to
          'firebase'.
       5. Recommended Firestore rules (Firestore → Rules) so only
          this app's memories collection is open:
            rules_version = '2';
            service cloud.firestore {
              match /databases/{database}/documents {
                match /nightowls_memories/{doc} {
                  allow read, write: if true;
                }
              }
            }
          (This keeps it simple/open like a shared gallery link. For
          real access control you'd add Firebase Auth — ask me if
          you want that added.)
     --------------------------------------------------------- */
  const BACKEND = 'claude'; // 'claude' | 'firebase'
  const FIREBASE_CONFIG = {
    apiKey: "",
    authDomain: "",
    projectId: "",
    storageBucket: "",
    messagingSenderId: "",
    appId: ""
  };
  let fbDb = null;

  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(s);
    });
  }

  async function initBackend(){
    if(BACKEND !== 'firebase') return;
    try{
      await loadScript('https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js');
      const app = firebase.initializeApp(FIREBASE_CONFIG);
      fbDb = firebase.firestore(app);
    }catch(e){
      console.error('Firebase failed to load, falling back to local storage this session.', e);
      showToast('Could not connect to Firebase — check FIREBASE_CONFIG');
    }
  }

  const $ = (sel, root) => (root||document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));

  /* ---------------- INTRO ---------------- */
  function initIntro(){
    const starsWrap = $('#stars');
    let s = '';
    for(let i=0;i<60;i++){
      const top = Math.random()*100, left = Math.random()*100, delay = (Math.random()*2.4).toFixed(2);
      s += `<span style="top:${top}%;left:${left}%;animation-delay:${delay}s"></span>`;
    }
    starsWrap.innerHTML = s;

    const introEl = $('#intro');
    const video = $('#introVideo');
    let duration = 3200;

    if(VIDEO_SRC){
      video.src = VIDEO_SRC;
      video.style.display = 'block';
      $('.stars').style.display = 'none';
      $('.sweep').style.display = 'none';
      video.play().catch(()=>{});
      video.addEventListener('ended', endIntro);
      duration = 12000; // safety fallback if 'ended' never fires
    }

    function endIntro(){
      if(introEl.classList.contains('hide')) return;
      introEl.classList.add('hide');
      setTimeout(()=>{
        introEl.style.display = 'none';
        $('#app').classList.add('show');
      }, 550);
    }

    $('#skipIntro').addEventListener('click', endIntro);
    setTimeout(endIntro, duration);
  }

  /* ---------------- STORAGE ---------------- */
  const PREFIX = 'nightowls-memory:';

  async function listMemories(){
    try{
      if(BACKEND === 'firebase' && fbDb){
        const snap = await fbDb.collection('nightowls_memories').get();
        const items = snap.docs.map(d => d.data());
        items.sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
        return items;
      }
      const res = await window.storage.list(PREFIX, true);
      const keys = (res && res.keys) || [];
      const items = [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, true);
          if(r && r.value) items.push(JSON.parse(r.value));
        }catch(e){ /* skip unreadable entry */ }
      }
      items.sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
      return items;
    }catch(e){
      console.error('listMemories failed', e);
      return [];
    }
  }

  async function saveMemory(mem){
    if(BACKEND === 'firebase' && fbDb){
      await fbDb.collection('nightowls_memories').doc(mem.id).set(mem);
      return mem;
    }
    const key = PREFIX + mem.id;
    const result = await window.storage.set(key, JSON.stringify(mem), true);
    if(!result) throw new Error('Storage write failed');
    return result;
  }

  async function deleteMemory(id){
    if(BACKEND === 'firebase' && fbDb){
      await fbDb.collection('nightowls_memories').doc(id).delete();
      return;
    }
    const key = PREFIX + id;
    await window.storage.delete(key, true);
  }

  /* ---------------- IMAGE COMPRESSION ---------------- */
  function compressImage(file, maxW){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read file'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not decode image'));
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- RENDER ---------------- */
  let MEMORIES = [];
  let pendingImage = null;

  function fmtDate(d){
    if(!d) return '';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function groupByYear(items){
    const map = new Map();
    items.forEach(m => {
      const y = (m.date || '').slice(0,4) || 'Undated';
      if(!map.has(y)) map.set(y, []);
      map.get(y).push(m);
    });
    return Array.from(map.entries()).sort((a,b) => b[0].localeCompare(a[0]));
  }

  function renderHero(){
    const slot = $('#heroSlot');
    if(MEMORIES.length === 0){
      slot.innerHTML = `
        <div class="hero" style="min-height:min(40vw,300px);">
          <div class="hero-content hero-empty" style="margin:auto;">
            <h2>Your night sky is empty</h2>
            <p>Add your first memory with your friends to start filling it in.</p>
            <button class="btn btn-primary" id="heroAddBtn">+ Add memory</button>
          </div>
        </div>`;
      $('#heroAddBtn').addEventListener('click', openAdd);
      return;
    }
    const m = MEMORIES[0];
    const friends = (m.friends||[]).slice(0,3).join(', ');
    slot.innerHTML = `
      <div class="hero">
        <div class="hero-bg" style="background-image:url('${m.image}')"></div>
        <div class="hero-fade"></div>
        <div class="hero-content">
          <div class="hero-eyebrow">Latest memory</div>
          <div class="hero-title">${escapeHtml(m.title)}</div>
          <div class="hero-meta">${fmtDate(m.date)}${friends ? ' &middot; with ' + escapeHtml(friends) : ''}</div>
          <button class="btn btn-primary" id="heroOpenBtn">View memory</button>
        </div>
      </div>`;
    $('#heroOpenBtn').addEventListener('click', () => openDetail(m.id));
  }

  function renderRows(){
    const slot = $('#rowsSlot');
    if(MEMORIES.length === 0){ slot.innerHTML = ''; return; }
    const groups = groupByYear(MEMORIES);
    slot.innerHTML = groups.map(([year, items], gi) => `
      <div class="section-title">${year} <small>${items.length} memor${items.length===1?'y':'ies'}</small></div>
      <div class="row-track">
        ${items.map(cardHtml).join('')}
        ${gi === 0 ? `<div class="addcard" data-add="1"><div class="plus">+</div><div>Add memory</div></div>` : ''}
      </div>
    `).join('');
    $$('.card', slot).forEach(el => el.addEventListener('click', () => openDetail(el.dataset.id)));
    $$('.addcard', slot).forEach(el => el.addEventListener('click', openAdd));
  }

  function cardHtml(m){
    return `
      <div class="card" data-id="${m.id}">
        <img src="${m.image}" alt="${escapeHtml(m.title)}" loading="lazy">
        <div class="card-info">
          <div class="t">${escapeHtml(m.title)}</div>
          <div class="d">${fmtDate(m.date)}</div>
        </div>
      </div>`;
  }

  function escapeHtml(str){
    return String(str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function renderAll(){
    renderHero();
    renderRows();
  }

  /* ---------------- MODALS ---------------- */
  function openOverlay(id){ $('#'+id).classList.add('open'); }
  function closeOverlay(id){ $('#'+id).classList.remove('open'); }

  function openAdd(){
    $('#titleInput').value = '';
    $('#friendsInput').value = '';
    $('#dateInput').value = new Date().toISOString().slice(0,10);
    $('#dropPreview').style.display = 'none';
    $('#dropText').style.display = 'block';
    $('#dropZone').classList.remove('has-img');
    $('#fileInput').value = '';
    pendingImage = null;
    openOverlay('addOverlay');
  }

  function openDetail(id){
    const m = MEMORIES.find(x => x.id === id);
    if(!m) return;
    const friendsHtml = (m.friends||[]).map(f => `<span class="chip">${escapeHtml(f)}</span>`).join('');
    $('#detailModal').innerHTML = `
      <img class="detail-img" src="${m.image}" alt="${escapeHtml(m.title)}">
      <div class="detail-body">
        <div class="detail-title">${escapeHtml(m.title)}</div>
        <div class="detail-meta">${fmtDate(m.date)}</div>
        <div style="margin-bottom:18px;">${friendsHtml || '<span style="color:var(--fog)">No friends tagged</span>'}</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-close="detailOverlay">Close</button>
          <button class="btn danger" id="deleteBtn">Delete</button>
        </div>
      </div>`;
    $('#deleteBtn').addEventListener('click', async () => {
      $('#deleteBtn').innerHTML = '<span class="spinner"></span>';
      try{
        await deleteMemory(m.id);
        MEMORIES = MEMORIES.filter(x => x.id !== m.id);
        renderAll();
        closeOverlay('detailOverlay');
        showToast('Memory deleted');
      }catch(e){
        showToast('Could not delete — try again');
      }
    });
    openOverlay('detailOverlay');
  }

  function openAllGrid(){
    const grid = $('#allGrid');
    if(MEMORIES.length === 0){
      grid.innerHTML = `<div style="color:var(--fog); grid-column:1/-1;">No memories yet.</div>`;
    } else {
      grid.innerHTML = MEMORIES.map(m => `
        <div class="card" style="width:100%;" data-id="${m.id}">
          <img src="${m.image}" alt="${escapeHtml(m.title)}" loading="lazy">
          <div class="card-info"><div class="t">${escapeHtml(m.title)}</div></div>
        </div>`).join('');
      $$('.card', grid).forEach(el => el.addEventListener('click', () => {
        closeOverlay('allOverlay');
        openDetail(el.dataset.id);
      }));
    }
    openOverlay('allOverlay');
  }

  function showToast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------------- EVENTS ---------------- */
  function initEvents(){
    $('#openAddBtn').addEventListener('click', openAdd);
    $('#openAllBtn').addEventListener('click', openAllGrid);

    $$('[data-close]').forEach(el => el.addEventListener('click', () => closeOverlay(el.dataset.close)));
    $$('.overlay').forEach(el => el.addEventListener('click', (e) => { if(e.target === el) el.classList.remove('open'); }));

    const dropZone = $('#dropZone'), fileInput = $('#fileInput');
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if(!file) return;
      try{
        $('#dropText').textContent = 'Loading photo…';
        const dataUrl = await compressImage(file, 1100);
        pendingImage = dataUrl;
        $('#dropPreview').src = dataUrl;
        $('#dropPreview').style.display = 'block';
        $('#dropText').style.display = 'none';
        dropZone.classList.add('has-img');
      }catch(e){
        showToast('Could not load that photo');
        $('#dropText').textContent = 'Tap to choose a photo, or drag one here';
      }
    });
    ['dragover','drop'].forEach(evt => dropZone.addEventListener(evt, e => e.preventDefault()));
    dropZone.addEventListener('drop', e => {
      if(e.dataTransfer.files[0]){ fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); }
    });

    $('#saveMemoryBtn').addEventListener('click', async () => {
      const title = $('#titleInput').value.trim();
      const date = $('#dateInput').value;
      const friends = $('#friendsInput').value.split(',').map(s=>s.trim()).filter(Boolean);
      if(!pendingImage){ showToast('Add a photo first'); return; }
      if(!title){ showToast('Give it a title'); return; }

      const btn = $('#saveMemoryBtn');
      const original = btn.textContent;
      btn.innerHTML = '<span class="spinner"></span>';
      try{
        const mem = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
          title, date, friends, image: pendingImage, createdAt: Date.now()
        };
        await saveMemory(mem);
        MEMORIES.unshift(mem);
        MEMORIES.sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
        renderAll();
        closeOverlay('addOverlay');
        showToast('Memory added');
      }catch(e){
        showToast('Could not save — try again');
      }finally{
        btn.textContent = original;
      }
    });
  }

  /* ---------------- INIT ---------------- */
  document.addEventListener('DOMContentLoaded', async () => {
    initIntro();
    initEvents();
    await initBackend();
    MEMORIES = await listMemories();
    renderAll();
  });
})();
</script>
</body>
</html>
